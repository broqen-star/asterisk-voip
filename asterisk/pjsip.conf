;==============================================================
; pjsip.conf  —  SIP 内線の定義
;--------------------------------------------------------------
; 登場する内線は2つだけ:
;   phone : 応答する側(スマホのLinphone / ラズパイ など)  内線番号 200
;   ht813 : 電話回線側のゲートウェイ(HT813 の FXO)
;
; ★ パスワードは必ず変更してください（2か所: password の行）。
;   ht813 のパスワードは、HT813 本体側にも同じ値を設定します。
;
; ★ この構成では トランスポートを LAN側 / VPN側 の2つに分けています。
;   phone は WireGuard(wg0) 経由でしか登録できません。
;   ※ 0.0.0.0:5060 と 10.9.0.1:5060 は同時に bind できないため、
;     LAN側も必ず実IPを明示すること。
;
; ※ 重要: endpoint / auth / aor は「同じ名前」で揃えてあります。
;   登録(REGISTER)を受け付けるには AOR 名が一致している必要があるためです。
;   （PJSIP では type 違いなら同名セクションを複数持てます）
;==============================================================

[global]
type=global

;==============================================================
; トランスポート
;--------------------------------------------------------------
; transport-udp : LAN側。HT813 が接続してくる。
; transport-wg  : VPN側。スマホ(Linphone) が接続してくる。
;
; ★ wg0 より先に Asterisk が起動すると 10.9.0.1 が存在せず bind に失敗する。
;   ホスト側で下記を一度実行して回避しておくこと:
;     echo 'net.ipv4.ip_nonlocal_bind=1' | sudo tee /etc/sysctl.d/99-asterisk.conf
;     sudo sysctl --system
;==============================================================

[transport-udp]
type=transport
protocol=udp
bind=192.168.100.50:5060   ; ★サーバのLAN IPに書き換える（ip -4 addr show で確認）

[transport-wg]
type=transport
protocol=udp
bind=10.9.0.1:5060         ; WireGuard のサーバ側アドレス

;==============================================================
; 応答する内線 (スマホ / ラズパイ)   内線番号: 200
;   → VPN(wg0) 経由からのみ登録可能
;==============================================================
[phone]
type=endpoint
transport=transport-wg  ; ★VPN側に固定。LAN/インターネットからは登録できない
context=from-internal
disallow=all
allow=ulaw
allow=alaw
auth=phone-auth
aors=phone
; --- NAT/宅内でも音声が通りやすくする定番設定 ---
; ※トンネル内はNATが無いので必須ではないが、自宅Wi-Fi等で使う場合に備えて残す
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[phone-auth]
type=auth
auth_type=userpass
username=phone
password=phone          ; ★変更する（openssl rand -base64 18 などで生成）

[phone]
type=aor
max_contacts=3          ; 同じ内線にスマホ+ラズパイ+予備を同時登録して一斉に鳴らせる
qualify_frequency=30
remove_existing=no

;==============================================================
; 電話回線側ゲートウェイ (HT813 の FXO)
;   → LAN 経由
;==============================================================
[ht813]
type=endpoint
transport=transport-udp ; ★LAN側に固定
context=from-pstn       ; ここから来た着信=外線着信 として扱う
disallow=all
allow=ulaw
allow=alaw
auth=ht813-auth
aors=ht813
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[ht813-auth]
type=auth
auth_type=userpass
username=ht813
password=ht813          ; ★変更する（HT813本体にも同じ値を設定）

[ht813]
type=aor
max_contacts=1
qualify_frequency=30
