;==============================================================
; extensions.conf  —  ダイヤルプラン(通話の流れ)
;--------------------------------------------------------------
; 目的:
;   1) 外線着信を スマホ/ラズパイ(内線200) に鳴らす
;   2) 応答されなかったら 案内を流して「伝言を録音」する
;   3) Linphone から HT813 経由で 既存PBX の内線/外線へ発信する
;==============================================================

[general]
static=yes
writeprotect=no
clearglobalvars=yes    ; reload 時に globals を再読み込みする

[globals]
; 鳴らす先。同じ内線 phone に複数台を登録すれば一斉に鳴る
PHONE=PJSIP/phone
RING_TIMEOUT=10                 ; 内線200を鳴らす秒数。ここを超えたら案内→録音へ
ANNOUNCE=custom/rec_guidance    ; 案内音声（拡張子 .wav は書かない）
THANKS=custom/rec_thanks

; --- 録音（不応答時の伝言） ---
;   RECDIR は docker-compose.yml で ホストの ./recordings に rw マウントする
RECDIR=/var/spool/asterisk/recordings
REC_MAXSEC=120                  ; 1件あたりの最大録音秒数
REC_SILENCE=5                   ; この秒数だけ無音が続いたら録音終了

; --- 音声品質調査用の通話録音（伝言録音とは別物・別ディレクトリ） ---
;   通話中の音声を「行き」「帰り」に分けて録るための設定。
;   伝言の録音(RECDIR)とは混ざらないよう qa/ サブディレクトリに置く。
;   → 留守電の通知スクリプトや内線202の対象にもならない。
QADIR=/var/spool/asterisk/recordings/qa
QA_GAIN=                        ; 送出音量の補正(空=なし)。-4〜4程度。まずは空で測ること

;==============================================================
; 音声品質調査用の録音（サブルーチン）
;--------------------------------------------------------------
; 呼び方:
;   Gosub(qa-rec,s,1(in))   … 外線着信の通話（録音チャネル=HT813側）
;   Gosub(qa-rec,s,1(out))  … Linphoneからの発信（録音チャネル=Linphone側）
;
; ON/OFF:
;   内線 291 = 録音ON / 292 = 録音OFF （AstDBに保存。Asterisk再起動不要）
;   初期値は .env の QA_RECORD（1で有効 / 既定は無効）
;
; 出力（${QADIR} = ./recordings/qa/）:
;   日時_方向_相手番号_ID.wav       両方向ミックス（耳で聴く用）
;   同 -rx.wav                      録音チャネルが「受け取った」音声
;   同 -tx.wav                      録音チャネルへ「送った」音声
;
; どちらが自分の声か:
;   out(発信): rx = 自分(Linphone)の声 / tx = 相手(PBX)の声
;   in(着信) : tx = 自分(Linphone)の声 / rx = 相手(PBX)の声
;   ※ 内線296のダブルトーク試験を1回録れば、確実に確認できる
;      （BGMが入っているほうが「相手の声」トラック）
;
; ★ 分けて録るのが肝心。ミックスだけだと「どちらの音が消えているか」が
;   判別できず、同時発話で聞こえなくなる原因を特定できない。
;==============================================================
[qa-rec]
exten => s,1,NoOp(=== 品質録音 判定 ===)
 ; AstDB(内線291/292で切替) を優先し、未設定なら .env の QA_RECORD を見る
 same => n,Set(QAON=${DB(qa/record)})
 same => n,ExecIf($["${QAON}" = ""]?Set(QAON=${ENV(QA_RECORD)}))
 same => n,GotoIf($["${QAON}" != "1"]?off)

 ; MixMonitor はディレクトリを作らないので、ここで用意する
 same => n,TrySystem(/bin/mkdir -p ${QADIR})

 same => n,Set(QADIR_TAG=${IF($["${ARG1}" != ""]?${ARG1}:call)})
 same => n,Set(QANUM=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:${EXTEN})})
 ; UNIQUEID には . が入りファイル名の拡張子判定を壊すので数字だけ残す
 same => n,Set(QAID=${FILTER(0-9,${UNIQUEID})})
 same => n,Set(QABASE=${QADIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${QADIR_TAG}_${QANUM}_${QAID})

 ; r() = このチャネルから受けた音声 / t() = このチャネルへ送った音声
 same => n,MixMonitor(${QABASE}.wav,r(${QABASE}-rx.wav)t(${QABASE}-tx.wav))
 same => n,NoOp(=== 品質録音を開始: ${QABASE}.wav ===)

 ; --- 任意: 送出音量の補正（QA_GAIN が空でなければ適用） ---
 ;   相手に小さく聞こえる場合の応急処置。まずは空のまま測定すること。
 ;   out(発信)時は「チャネルから読む音」= 自分の声 → VOLUME(RX)
 ;   in(着信)時は「チャネルへ書く音」= 自分の声 → VOLUME(TX)
 same => n,GotoIf($["${QA_GAIN}" = ""]?done)
 same => n,ExecIf($["${ARG1}" = "out"]?Set(VOLUME(RX)=${QA_GAIN}))
 same => n,ExecIf($["${ARG1}" = "in"]?Set(VOLUME(TX)=${QA_GAIN}))
 same => n,NoOp(=== 送出ゲイン補正 ${QA_GAIN} を適用 ===)

 same => n(done),Return()
 same => n(off),NoOp(=== 品質録音は無効(291でON) ===)
 same => n,Return()

;==============================================================
; 外線着信: HT813(FXO) → ここに入ってくる
;==============================================================
[from-pstn]
; 番号付き・番号なし(s) どちらも同じ処理へ集約
exten => _X.,1,Goto(inbound,1)
exten => s,1,Goto(inbound,1)

exten => inbound,1,NoOp(=== 外線着信 CID=${CALLERID(num)} ===)
 same => n,Gosub(qa-rec,s,1(in))              ; 品質調査用の録音（291でON / 既定は無効）
 same => n,Dial(${PHONE},${RING_TIMEOUT})     ; 応答すればここで通話 → 終わればチャネル終了
 ; --- ここから下は「応答されなかった」場合だけ通る ---
 same => n,NoOp(=== 不応答 DIALSTATUS=${DIALSTATUS} → 案内＋録音 ===)
 same => n,Answer()                           ; ★アナウンス再生・録音には応答が必須
 same => n,Wait(1)                            ; 音声が頭切れしないよう1秒待つ
 same => n,Playback(${ANNOUNCE})
 ; 保存名: 20260814-153012_5105.wav （CIDが取れなければ unknown）
 same => n,Set(CID=${IF($["${CALLERID(num)}" != ""]?${CALLERID(num)}:unknown)})
 same => n,Set(RECFILE=${RECDIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_${CID})
 ; オプション k = 相手が # を押さず切った場合もファイルを残す（これが無いと破棄される）
 same => n,Record(${RECFILE}.wav,${REC_SILENCE},${REC_MAXSEC},k)
 same => n,NoOp(=== 録音終了 ${RECFILE}.wav ===)
 same => n,GotoIf($["${THANKS}" = ""]?bye)
 same => n,Playback(${THANKS})
 same => n,NoOp(=== お礼アナウンス PLAYBACKSTATUS=${PLAYBACKSTATUS} ===)
 same => n(bye),Wait(1)
 same => n,Hangup()

; --- 通話終了時: 録音があれば通知(Discord/メール) ---
;   相手が黙って切った場合 Record の次の行には進まないため、通知は必ず h に置く
;   末尾の & でバックグラウンド実行し、curl の待ちでチャネル解放が遅れないようにする
exten => h,1,NoOp(=== hangup RECFILE=${RECFILE} ===)
 same => n,GotoIf($["${RECFILE}" = ""]?norec)
 same => n,NoOp(=== 通知スクリプトを起動: ${RECFILE}.wav CID=${CID} ===)
 same => n,TrySystem(/bin/bash /etc/asterisk/scripts/notify.sh "${RECFILE}.wav" "${CID}" &)
 same => n,Goto(end)
 same => n(norec),NoOp(=== 録音なしのため通知しません ===)
 same => n(end),NoOp(=== 終了 ===)

;==============================================================
; 内線からの発信 (Linphone → Asterisk → HT813 → PBX)
;==============================================================
[from-internal]
; --- 疎通テスト: 200 で自分(スマホ/ラズパイ)が鳴る ---
exten => 200,1,NoOp(=== 内線テスト ===)
 same => n,Dial(${PHONE},20)
 same => n,Hangup()

; --- 案内音声の再生テスト（Linphoneから 201 にダイヤル） ---
exten => 201,1,NoOp(=== 案内音声テスト ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(${ANNOUNCE})
 same => n,Hangup()

; --- 202: 最新の録音を1件だけ再生（留守電の確認用） ---
;   ※ SHELL() が無効な環境では動作しません。その場合はホストの
;      ./recordings/ を直接開いて再生してください。
exten => 202,1,NoOp(=== 最新録音の再生 ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(LAST=${SHELL(ls -t ${RECDIR}/*.wav 2>/dev/null | head -1 | sed 's/\.wav$//' | tr -d '\n')})
 same => n,GotoIf($["${LAST}" = ""]?nomsg)
 same => n,Playback(${LAST})
 same => n,Hangup()
 same => n(nomsg),Playback(vm-nomessages)
 same => n,Hangup()

; --- 203: 録音のテスト（着信を待たずに録音動作だけ確認する） ---
exten => 203,1,NoOp(=== 録音テスト ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(CID=test)
 same => n,Set(RECFILE=${RECDIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_test)
 same => n,Record(${RECFILE}.wav,${REC_SILENCE},60,k)
 same => n,NoOp(=== 録音終了 ${RECFILE}.wav ===)
 same => n,Playback(${RECFILE})              ; 録れたものをそのまま聞き返す
 same => n,GotoIf($["${THANKS}" = ""]?bye)
 same => n,Playback(${THANKS})
 same => n,NoOp(=== お礼アナウンス PLAYBACKSTATUS=${PLAYBACKSTATUS} ===)
 same => n(bye),Hangup()

; --- 204: 通知のテスト（電話をかけずに Discord/メール送信だけ試す） ---
;   .env の設定がそのまま使われる。結果は ./recordings/notify.log に出る。
exten => 204,1,NoOp(=== 通知テスト ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,TrySystem(/bin/bash /etc/asterisk/scripts/notify.sh --test 0000 &)
 same => n,Playback(beep)
 same => n,Hangup()

; --- 205: お礼アナウンスの再生テスト（Linphoneから 205 にダイヤル） ---
exten => 205,1,NoOp(=== お礼アナウンステスト ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf($["${THANKS}" = ""]?nofile)
 same => n,Playback(${THANKS})
 same => n,NoOp(=== PLAYBACKSTATUS=${PLAYBACKSTATUS} ===)
 same => n,Hangup()
 same => n(nofile),NoOp(=== THANKS が未設定です ===)
 same => n,Hangup()

; --- 251: シャイニングスター ループ再生 ---
exten => 251,1,NoOp(=== 音楽ループ再生 ===)
 same => n,Answer()
 same => n,Set(LOOPCOUNT=0)
 same => n,While($[1])                    ; 無限ループ
 same => n,Playback(custom/shining_star)
 same => n,EndWhile()
 same => n,Hangup()

; --- 252: BGM ループ再生 ---
exten => 252,1,NoOp(=== 音楽ループ再生 ===)
 same => n,Answer()
 same => n,Set(LOOPCOUNT=0)
 same => n,While($[1])                    ; 無限ループ
 same => n,Playback(custom/2_23_AM)
 same => n,EndWhile()
 same => n,Hangup()

; --- 通信品質確認用: エコーテスト ---
exten => 290,1,NoOp(=== エコーテスト開始 ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)      ; "You are about to be placed in an echo test" (英語)
 same => n,Echo()                       ; ここで話した声がそのまま返ってくる
 same => n,Playback(demo-echodone)      ; 終了案内
 same => n,Hangup()

;--------------------------------------------------------------
; 音声品質調査用の録音: 操作と試験
;--------------------------------------------------------------
; --- 291: 品質録音を ON（以後の全通話を qa/ に両方向別トラックで録る） ---
exten => 291,1,NoOp(=== 品質録音 ON ===)
 same => n,Answer()
 same => n,Set(DB(qa/record)=1)
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Playback(beep)
 same => n,Hangup()

; --- 292: 品質録音を OFF ---
exten => 292,1,NoOp(=== 品質録音 OFF ===)
 same => n,Answer()
 same => n,Set(DB(qa/record)=0)
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Hangup()

; --- 295: 基準取り（単独発話時に自分の声がどのレベルで届いているか） ---
;   ビープの後、普通の声で10秒ほど話して切る。エコーで自分の声が返る。
;   → 解析すると「発話中の平均レベル」が分かる。-30dBFSより小さければ音量不足。
exten => 295,1,NoOp(=== 品質録音つきエコーテスト ===)
 same => n,Answer()
 same => n,TrySystem(/bin/mkdir -p ${QADIR})
 same => n,Set(QABASE=${QADIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_out_echo_${FILTER(0-9,${UNIQUEID})})
 same => n,MixMonitor(${QABASE}.wav,r(${QABASE}-rx.wav)t(${QABASE}-tx.wav))
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

; --- 296: ダブルトーク試験（★ 同時発話で聞こえづらい件の切り分けはこれ） ---
;   BGMが流れている＝「相手が話している」状態。その最中に、
;   まず5秒黙り → 次に10秒しゃべる → 切る。
;   PBXもHT813も一切通らないので、ここで自分の声が削られていたら
;   犯人は Linphone(スマホ)側のエコーキャンセラ/AGCで確定する。
exten => 296,1,NoOp(=== ダブルトーク試験 ===)
 same => n,Answer()
 same => n,TrySystem(/bin/mkdir -p ${QADIR})
 same => n,Set(QABASE=${QADIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}_out_dt_${FILTER(0-9,${UNIQUEID})})
 same => n,MixMonitor(${QABASE}.wav,r(${QABASE}-rx.wav)t(${QABASE}-tx.wav))
 same => n,Wait(1)
 same => n,Playback(beep)
 ; まず無音区間: ここで「単独発話」の基準を取るため10秒しゃべる
 same => n,Wait(10)
 same => n,Playback(beep)
 ; ここからBGM=相手の声。重ねてしゃべる
 same => n,While($[1])
 same => n,Playback(custom/shining_star)
 same => n,EndWhile()
 same => n,Hangup()

; --- 既存PBXの内線へ発信 (5xxx / 8xxx の4桁) ---
;   例: 5105, 8203 など。HT813経由でPBXへ番号を送出する。
exten => _5XXX,1,NoOp(=== 内線発信 ${EXTEN} → HT813経由 ===)
 same => n,Gosub(qa-rec,s,1(out))         ; 品質調査用の録音（291でON）
 same => n,Dial(PJSIP/${EXTEN}@ht813,30)
 same => n,Hangup()

exten => _8XXX,1,NoOp(=== 内線発信 ${EXTEN} → HT813経由 ===)
 same => n,Gosub(qa-rec,s,1(out))         ; 品質調査用の録音（291でON）
 same => n,Dial(PJSIP/${EXTEN}@ht813,30)
 same => n,Hangup()

; --- 外線へ発信 (0発信) ---
;   PBXが「0発信」で外線をつかむ仕様。頭の0込みでそのままHT813へ渡す。
;   うまく繋がらない場合は 0 の後にポーズを入れる例:
;     Dial(PJSIP/0w${EXTEN:1}@ht813,60)
;   ★安全網: 万一の切れ残りに備え通話上限を付けたい場合は L(ミリ秒) を足す。
;     例) 60分で強制終了: Dial(PJSIP/${EXTEN}@ht813,60,L(3600000))
exten => _0X.,1,NoOp(=== 外線発信 ${EXTEN} → HT813経由 ===)
 same => n,Gosub(qa-rec,s,1(out))         ; 品質調査用の録音（291でON）
 same => n,Dial(PJSIP/${EXTEN}@ht813,60)
 same => n,Hangup()

; --- 通話終了時: 録音があれば通知(Discord/メール) ---
;   相手が黙って切った場合 Record の次の行には進まないため、通知は必ず h に置く
;   末尾の & でバックグラウンド実行し、curl の待ちでチャネル解放が遅れないようにする
exten => h,1,NoOp(=== hangup RECFILE=${RECFILE} ===)
 same => n,GotoIf($["${RECFILE}" = ""]?norec)
 same => n,NoOp(=== 通知スクリプトを起動: ${RECFILE}.wav CID=${CID} ===)
 same => n,TrySystem(/bin/bash /etc/asterisk/scripts/notify.sh "${RECFILE}.wav" "${CID}" &)
 same => n,Goto(end)
 same => n(norec),NoOp(=== 録音なしのため通知しません ===)
 same => n(end),NoOp(=== 終了 ===)
 