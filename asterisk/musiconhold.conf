;==============================================================
; musiconhold.conf  —  保留音 / 呼び出し中アナウンス
;--------------------------------------------------------------
; Dial() の m(クラス名) オプションで、呼び出し中に発信者へ流す音として使う。
; ファイルは 8000Hz / 16bit / モノラル の wav を推奨（既存の sounds と同じ形式）。
;==============================================================

; --- 通常の保留音（イメージ同梱のもの） ---
[default]
mode=files
directory=/usr/share/asterisk/moh

; --- 呼び出し中アナウンス用 ---
;   ./asterisk/moh/ の中身をファイル名順に再生し、最後まで行くと先頭へ戻る。
;     01_announce.wav … 「この電話はサーバー室です」等のアナウンス
;     02_ringback.wav … 呼び出し音（1秒鳴動/2秒休止 ×4）
;   → アナウンス → 呼出音 → アナウンス … の繰り返しになる。
[announce]
mode=files
directory=/var/lib/asterisk/moh/announce
sort=alpha
