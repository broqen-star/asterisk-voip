;==============================================================
; rtp.conf  —  音声(RTP)が使うポート範囲
; host ネットワークで動かすのでこの範囲がそのまま使われます。
;
; ★ WireGuard 構成では、wg0 の iptables で許可したレンジと
;   必ず一致させること（/etc/wireguard/wg0.conf の下記の行）:
;     PostUp = iptables -A WG_IN -p udp --dport 10000:10100 -j ACCEPT
;
;   1通話につき2ポート使用。100ポートあれば同時50通話まで賄えるため、
;   既定の 10000-20000 は広すぎる。開ける範囲は狭いほうが安全。
;==============================================================
[general]
rtpstart=10000
rtpend=10100
